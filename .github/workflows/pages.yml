name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # With a custom domain (site/CNAME) the site lives at the domain root;
      # otherwise Pages serves it under /<repo-name>/.
      - name: Build
        run: |
          if [ -f site/CNAME ]; then base=""; else base="/${GITHUB_REPOSITORY#*/}"; fi
          python3 scripts/build.py "$base"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
