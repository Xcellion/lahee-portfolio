name: Snapshot Storyblok

# Saves the original Storyblok images and API responses into site/ and commits
# them, so the copy no longer depends on Storyblok. Run it from the Actions tab,
# or push a branch that contains scripts/storyblok-snapshot.todo.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [scripts/storyblok-snapshot.todo]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/mirror.py --storyblok
      - name: Commit
        run: |
          rm -f scripts/storyblok-snapshot.todo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site scripts
          git diff --cached --quiet || git commit -m "Snapshot Storyblok images and API data"
          git push
